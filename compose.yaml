name: kotolancer-local
services:
  postgres:
    image: postgres:17.10
    environment:
      POSTGRES_USER: kotolancer
      POSTGRES_PASSWORD: local-kotolancer
      POSTGRES_DB: kotolancer
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kotolancer -d kotolancer"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
